<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookedinlagos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --dark: #0A0A0A;
    --dark2: #141414;
    --dark3: #1E1E1E;
    --cream: #F5EDD6;
    --cream2: #EAD9B4;
    --text: #F0E8D5;
    --muted: #8A7A60;
  }

  body {
    background: var(--dark);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 10%, rgba(201,168,76,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 90%, rgba(201,168,76,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    animation: fadeUp 0.8s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo-ring {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    position: relative;
    animation: fadeUp 0.8s 0.1s ease both;
  }

  .logo-ring::before {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #2a2218, #0e0c09);
    border: 0.5px solid rgba(201,168,76,0.3);
  }

  .logo-initial {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 900;
    color: var(--gold);
    position: relative;
    z-index: 1;
    letter-spacing: -1px;
  }

  .name {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 900;
    color: var(--cream);
    letter-spacing: 0.5px;
    text-align: center;
    margin-bottom: 8px;
    animation: fadeUp 0.8s 0.2s ease both;
  }

  .tagline {
    font-size: 13px;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 40px;
    animation: fadeUp 0.8s 0.3s ease both;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 40px;
    animation: fadeUp 0.8s 0.35s ease both;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    padding: 16px 22px;
    background: var(--dark2);
    border: 0.5px solid rgba(201,168,76,0.2);
    border-radius: 14px;
    text-decoration: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.8s ease both;
  }

  .link-btn:nth-child(1) { animation-delay: 0.4s; }
  .link-btn:nth-child(2) { animation-delay: 0.5s; }
  .link-btn:nth-child(3) { animation-delay: 0.6s; }

  .link-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.25s ease;
    border-radius: inherit;
  }

  .link-btn:hover { border-color: rgba(201,168,76,0.5); transform: translateY(-2px); }
  .link-btn:hover::before { opacity: 1; }
  .link-btn:active { transform: translateY(0) scale(0.99); }

  .btn-wa::before  { background: rgba(37,211,102,0.06); }
  .btn-ig::before  { background: rgba(228,64,95,0.06); }
  .btn-tt::before  { background: rgba(255,255,255,0.04); }

  .link-btn:hover .arrow { transform: translateX(4px); opacity: 1; }

  .icon-wrap {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-wa { background: rgba(37,211,102,0.12); }
  .icon-ig { background: rgba(228,64,95,0.12); }
  .icon-tt { background: rgba(255,255,255,0.08); }

  .icon-wrap svg { width: 20px; height: 20px; }

  .btn-text { flex: 1; }
  .btn-label { display: block; font-size: 15px; font-weight: 500; color: var(--cream); }
  .btn-sub { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }

  .arrow {
    font-size: 16px;
    color: var(--gold);
    opacity: 0.5;
    transition: all 0.25s ease;
  }

  .footer {
    margin-top: 40px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    animation: fadeUp 0.8s 0.8s ease both;
  }
</style>
</head>
<body>

</html>
